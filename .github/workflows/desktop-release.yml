name: Build desktop apps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, platform: Windows-x86_64, extension: exe}
          - {runner: macos-15, platform: macOS-arm64, extension: zip}
          - {runner: macos-15-intel, platform: macOS-x86_64, extension: zip}
          - {runner: ubuntu-22.04, platform: Linux-x86_64, extension: tar.gz}
    env:
      ASSET: RD_EQD2_Optimizer-${{ matrix.platform }}.${{ matrix.extension }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install the Linux GUI test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk xvfb xauth

      - name: Build and test the Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/build.py Build Release

      - name: Build and test the native app
        if: runner.os != 'Linux'
        run: python tools/build.py Build Release

      - name: Stage the download
        shell: bash
        run: |
          mkdir -p release
          case "$RUNNER_OS" in
            Windows)
              cp dist/Release/RD_EQD2_Optimizer.exe "release/$ASSET"
              ;;
            macOS)
              ditto -c -k --sequesterRsrc --keepParent \
                dist/Release/RD_EQD2_Optimizer.app "release/$ASSET"
              ;;
            Linux)
              tar -czf "release/$ASSET" -C dist/Release RD_EQD2_Optimizer
              ;;
          esac
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name != 'pull_request'
        with:
          name: desktop-${{ matrix.platform }}
          path: release/${{ env.ASSET }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Create the release with verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url; then
            exit 0
          fi
          cd release
          assets=(
            RD_EQD2_Optimizer-Windows-x86_64.exe
            RD_EQD2_Optimizer-macOS-arm64.zip
            RD_EQD2_Optimizer-macOS-x86_64.zip
            RD_EQD2_Optimizer-Linux-x86_64.tar.gz
          )
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$tag" "${assets[@]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RD EQD2 Optimizer $tag" --generate-notes
